# Интерфейс живёт отдельно от сервиса: сам сервис — чистый API, как требует задание.
# Здесь только отдача статики и проксирование к сервису.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Входной файл бывает до трёх гигабайт, расчёт идёт долго.
    client_max_body_size 3g;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://app:8080;
    }

    location /swagger-ui {
        proxy_pass http://app:8080;
    }

    location /actuator/ {
        proxy_pass http://app:8080;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
