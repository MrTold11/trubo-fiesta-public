version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trubo-fiesta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trubo_fiesta}
      POSTGRES_USER: ${DB_USER:-trubo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trubo}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trubo} -d ${DB_NAME:-trubo_fiesta}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trubo-fiesta:${APP_VERSION:-1.0.0}
    container_name: trubo-fiesta-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8080
      SERVER_THREADS_MAX: ${SERVER_THREADS_MAX:-100}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trubo_fiesta}
      DB_USER: ${DB_USER:-trubo}
      DB_PASSWORD: ${DB_PASSWORD:-trubo}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      APP_STORAGE_ROOT_DIR: /var/lib/trubo-fiesta/store
      APP_STORAGE_TMP_DIR: /var/lib/trubo-fiesta/tmp
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-3GB}
      APP_MAX_DOWNLOAD_SIZE: ${APP_MAX_DOWNLOAD_SIZE:-500MB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/lib/trubo-fiesta
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ui:
    image: nginx:1.25-alpine
    container_name: trubo-fiesta-ui
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${UI_PORT:-8081}:80"
    volumes:
      - ./ui/html:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  app-storage:
